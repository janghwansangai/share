<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공감 표현 연습 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* 로딩 스피너 애니메이션 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-sky-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-2xl mx-4">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-sky-700">공감 표현 연습하기</h1>
            <p class="text-gray-500 mt-1">AI 친구와 함께 따뜻한 마음을 표현하는 법을 배워봐요!</p>
        </header>

        <main>
            <!-- 공감이 필요한 상황 섹션 -->
            <section class="mb-6">
                <h2 class="text-lg font-bold text-gray-800 mb-2">🤔 공감이 필요한 상황</h2>
                <div id="situation-box" class="bg-gray-100 p-4 rounded-lg min-h-[100px] flex items-center justify-center border-2 border-dashed border-gray-300">
                    <p id="situation-text" class="text-gray-700 text-center">새로운 문제를 받아오고 있어요. 잠시만 기다려주세요...</p>
                </div>
            </section>

            <!-- 공감 표현 입력 섹션 -->
            <section class="mb-6">
                 <h2 class="text-lg font-bold text-gray-800 mb-2">💌 나의 공감 표현</h2>
                <textarea id="empathy-input" class="w-full h-28 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" placeholder="이 상황에서 어떤 말을 해주면 좋을까요? 여기에 따뜻한 마음을 담아 적어보세요."></textarea>
            </section>

            <!-- 버튼 영역 -->
            <div class="flex flex-col sm:flex-row gap-2">
                <button id="grade-button" class="w-full bg-sky-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-sky-700 active:bg-sky-800 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                    채점하기
                </button>
                <button id="new-problem-button" class="w-full bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600 active:bg-green-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                    새로운 문제 받기
                </button>
            </div>

            <!-- 피드백 및 점수 섹션 -->
            <section id="feedback-container" class="mt-6 p-6 bg-sky-50 rounded-lg border border-sky-200 hidden">
                <h2 class="text-xl font-bold text-sky-800 mb-4 text-center">AI 선생님의 피드백</h2>
                <div id="feedback-content" class="text-center">
                    <!-- 점수와 피드백이 여기에 표시됩니다 -->
                </div>
            </section>
        </main>
    </div>

    <script>
        const situationText = document.getElementById('situation-text');
        const empathyInput = document.getElementById('empathy-input');
        const gradeButton = document.getElementById('grade-button');
        const newProblemButton = document.getElementById('new-problem-button');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackContent = document.getElementById('feedback-content');

        let currentSituation = "";
        let isLoading = false;

        // --- [수정] UI 로딩 상태를 관리하는 함수 ---
        function setLoading(loading) {
            isLoading = loading;
            gradeButton.disabled = loading;
            newProblemButton.disabled = loading;
            empathyInput.disabled = loading;
            if (loading) {
                // 특정 버튼이 아닌 전체적인 로딩 상태를 표시
                gradeButton.innerHTML = '<div class="loader mx-auto" style="width:20px; height:20px; border-width: 3px;"></div>';
            } else {
                gradeButton.textContent = '채점하기';
            }
        }
        
        // --- [수정] 에러 메시지를 화면에 표시하는 함수 ---
        function handleApiError(error, element) {
            console.error("오류 발생:", error);
            const errorMessage = `서버와 통신 중 오류가 발생했습니다: ${error.message}`;
            element.innerHTML = `<p class="text-red-500">${errorMessage}</p>`;
            if (element === feedbackContent) {
                 feedbackContainer.classList.remove('hidden');
            }
        }
        
        // --- [수정] 백엔드 서버에 새로운 상황을 요청하는 함수 ---
        async function fetchNewSituation() {
            setLoading(true);
            newProblemButton.textContent = "가져오는 중..."
            feedbackContainer.classList.add('hidden');
            empathyInput.value = '';
            situationText.textContent = "초등학생에게 어울리는 새로운 문제를 만들고 있어요...";
            
            try {
                // 백엔드의 /api/situation 엔드포인트로 요청
                const response = await fetch('/api/situation', { method: 'POST' });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP 오류! 상태: ${response.status}`);
                }

                const data = await response.json();
                currentSituation = data.situation;
                situationText.textContent = currentSituation;

            } catch (error) {
                handleApiError(error, situationText);
            } finally {
                setLoading(false);
                newProblemButton.textContent = "새로운 문제 받기"
            }
        }

        // --- [수정] 백엔드 서버에 채점을 요청하는 함수 ---
        async function gradeEmpathyExpression() {
            const userExpression = empathyInput.value.trim();

            if (!userExpression) {
                feedbackContent.innerHTML = `
                    <p class="text-5xl font-bold text-red-500 mb-2">0점</p>
                    <p class="text-gray-700">공감 표현을 입력하지 않으면 점수를 받을 수 없어요. 친구에게 해주고 싶은 말을 적어보세요!</p>
                `;
                feedbackContainer.classList.remove('hidden');
                return;
            }

            setLoading(true);
            feedbackContainer.classList.remove('hidden');
            feedbackContent.innerHTML = '<div class="loader mx-auto"></div><p class="mt-2 text-gray-500">AI 선생님이 꼼꼼하게 채점하고 있어요...</p>';

            try {
                // 백엔드의 /api/grade 엔드포인트로 상황과 답변을 함께 전송
                const response = await fetch('/api/grade', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        situation: currentSituation,
                        expression: userExpression,
                    }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP 오류! 상태: ${response.status}`);
                }

                const { feedback } = await response.json();
                let score = "??";
                let feedbackText = feedback;
                
                const scoreMatch = feedback.match(/(\d{1,3})점/);
                if (scoreMatch) {
                    score = scoreMatch[1];
                    feedbackText = feedback.replace(scoreMatch[0], '').trim();
                }
                
                feedbackContent.innerHTML = `
                    <p class="text-5xl font-bold text-sky-600 mb-2">${score}점</p>
                    <p class="text-gray-700 whitespace-pre-line">${feedbackText}</p>
                `;
            } catch (error) {
                handleApiError(error, feedbackContent);
            } finally {
                setLoading(false);
            }
        }

        gradeButton.addEventListener('click', gradeEmpathyExpression);
        newProblemButton.addEventListener('click', fetchNewSituation);
        
        // 페이지 로드 시 바로 새로운 문제를 가져옴
        window.addEventListener('DOMContentLoaded', fetchNewSituation);
    </script>
</body>
</html>
